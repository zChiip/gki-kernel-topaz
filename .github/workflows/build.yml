name: Build Optimized GKI 5.15 KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space & Setup Swap
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          
          # Cria um Swap de 8GB para evitar que o LTO rebente por falta de RAM
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Setup Build Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache bison flex libssl-dev libelf-dev bc python3 clang lld llvm curl
          
          sudo mkdir -p /usr/local/bin
          sudo curl -s https://storage.googleapis.com/git-repo-downloads/repo > /usr/local/bin/repo
          sudo chmod +x /usr/local/bin/repo

      - name: Setup Ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-gki-5.15-${{ github.run_id }}
          restore-keys: |
            ccache-gki-5.15-

      - name: Sync AOSP Common Kernel 5.15 (Base Android 13)
        run: |
          mkdir gki_kernel && cd gki_kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15 --depth=1
          repo sync -j$(nproc) --no-tags --no-clone-bundle

      - name: Inject KernelSU
        run: |
          cd gki_kernel/common
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -

      - name: Apply Custom Options via Fragment (LTO Enabled)
        run: |
          cd gki_kernel/common
          
          FRAG="arch/arm64/configs/zchip_optimize.fragment"
          
          echo 'CONFIG_LOCALVERSION="-zChip-Kernel-v1"' > $FRAG
          echo "CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y" >> $FRAG
          echo "CONFIG_CPU_FREQ_GOV_PERFORMANCE=y" >> $FRAG
          echo "CONFIG_ZRAM=y" >> $FRAG
          echo "CONFIG_ZSMALLOC=y" >> $FRAG
          echo "CONFIG_NET_SCH_FQ_CODEL=y" >> $FRAG
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> $FRAG
          echo "CONFIG_TCP_CONG_BBR=y" >> $FRAG
          echo "CONFIG_DEFAULT_BBR=y" >> $FRAG
          
          echo "CONFIG_THINLTO=y" >> $FRAG
          echo "CONFIG_LTO_CLANG_THIN=y" >> $FRAG

          echo "GKI_DISABLE_DEBUG_FS=n" >> build.config.gki.aarch64

      - name: Compile Optimized GKI Kernel (With Ccache & Swap)
        run: |
          cd gki_kernel
          export CC="ccache clang"
          export CXX="ccache clang++"
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          
          ccache -M 5G
          ccache -s
          
          BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh
          
          ccache -s

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GKI_5.15_zChip_KernelSU
          path: |
            gki_kernel/out/android13-5.15/dist/Image*
            gki_kernel/out/android13-5.15/dist/*.dtb
