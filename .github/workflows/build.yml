name: Build Optimized GKI 5.15 KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h

      - name: Setup Build Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache bison flex libssl-dev libelf-dev bc python3 clang lld llvm curl
          
          sudo mkdir -p /usr/local/bin
          sudo curl -s https://storage.googleapis.com/git-repo-downloads/repo > /usr/local/bin/repo
          sudo chmod +x /usr/local/bin/repo

      - name: Sync AOSP Common Kernel 5.15 (Base Android 13)
        run: |
          mkdir gki_kernel && cd gki_kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15 --depth=1
          repo sync -j$(nproc) --no-tags --no-clone-bundle

      - name: Inject KernelSU
        run: |
          cd gki_kernel/common
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -

      - name: Apply Custom Branding & Performance Tuning
        run: |
          cd gki_kernel/common
          
          CONFIG_FILE="arch/arm64/configs/gki_defconfig"
          
          echo 'CONFIG_LOCALVERSION="-zChip-Kernel-v1"' >> $CONFIG_FILE
          echo "CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y" >> $CONFIG_FILE
          echo "CONFIG_CPU_FREQ_GOV_PERFORMANCE=y" >> $CONFIG_FILE
          echo "CONFIG_ZRAM=y" >> $CONFIG_FILE
          echo "CONFIG_ZSMALLOC=y" >> $CONFIG_FILE
          echo "CONFIG_NET_SCH_FQ_CODEL=y" >> $CONFIG_FILE
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> $CONFIG_FILE
          echo "CONFIG_TCP_CONG_BBR=y" >> $CONFIG_FILE
          echo "CONFIG_DEFAULT_BBR=y" >> $CONFIG_FILE
          echo "CONFIG_THINLTO=y" >> $CONFIG_FILE
          echo "CONFIG_LTO_CLANG_THIN=y" >> $CONFIG_FILE

          # Atualiza e reorganiza o defconfig para passar na validação da Google
          make ARCH=arm64 gki_defconfig savedefconfig
          cp defconfig arch/arm64/configs/gki_defconfig

      - name: Compile Optimized GKI Kernel
        run: |
          cd gki_kernel
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          
          BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GKI_5.15_zChip_KernelSU
          path: |
            gki_kernel/out/android13-5.15/dist/Image*
            gki_kernel/out/android13-5.15/dist/*.dtb
