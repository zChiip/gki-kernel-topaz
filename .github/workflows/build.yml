name: Build Optimized GKI 5.15 KernelSU + SUSFS + Sync + WireGuard

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space & Setup Swap
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          
          sudo swapoff /swapfile || true
          sudo rm -f /swapfile
          
          sudo dd if=/dev/zero of=/swapfile bs=1M count=12288 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Setup Build Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache bison flex libssl-dev libelf-dev bc python3 clang lld llvm curl
          
          sudo mkdir -p /usr/local/bin
          sudo curl -s https://storage.googleapis.com/git-repo-downloads/repo > /usr/local/bin/repo
          sudo chmod +x /usr/local/bin/repo

      - name: Setup Ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-gki-5.15-susfs-wireguard-v2-${{ github.run_id }}
          restore-keys: |
            ccache-gki-5.15-susfs-
            ccache-gki-5.15-

      - name: Sync AOSP Common Kernel 5.15 (Base Android 13)
        run: |
          mkdir gki_kernel && cd gki_kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15 --depth=1
          repo sync -j$(nproc) --no-tags --no-clone-bundle

      - name: Inject KernelSU and SUSFS
        run: |
          cd gki_kernel/common
          
          # 1. Injeta o KernelSU oficial
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          
          # 2. Clona o repositório do SUSFS (5.15)
          git clone https://gitlab.com/simonsmh/kernel-SUFS.git -b 5.15 susfs_repo || true
          
          # 3. Aplica os patches do SUSFS
          if [ -d "susfs_repo" ]; then
            cp susfs_repo/kernel_patches/50_add_susfs_in_gki.patch . || true
            patch -p1 < 50_add_susfs_in_gki.patch || true
            
            cp -r susfs_repo/fs/susfs fs/ || true
            echo "CONFIG_KSU_SUSFS=y" >> drivers/kernelsu/Kconfig || true
            echo "obj-\$(CONFIG_KSU_SUSFS) += susfs/" >> drivers/kernelsu/Makefile || true
          fi

      - name: Apply Custom Options via Fragment (ThinLTO Active + SUSFS, Sync & WireGuard)
        run: |
          cd gki_kernel/common
          
          FRAG="arch/arm64/configs/zchip_optimize.fragment"
          
          # Força o nome personalizado e desativa o sufixo automático
          echo 'CONFIG_LOCALVERSION="-Zeus-GKI-Kernel"' > $FRAG
          echo 'CONFIG_LOCALVERSION_AUTO=n' >> $FRAG
          
          # Desempenho e I/O / Sync Tweaks
          echo "CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y" >> $FRAG
          echo "CONFIG_CPU_FREQ_GOV_PERFORMANCE=y" >> $FRAG
          echo "CONFIG_ZRAM=y" >> $FRAG
          echo "CONFIG_ZSMALLOC=y" >> $FRAG
          echo "CONFIG_NET_SCH_FQ_CODEL=y" >> $FRAG
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> $FRAG
          echo "CONFIG_TCP_CONG_BBR=y" >> $FRAG
          echo "CONFIG_DEFAULT_BBR=y" >> $FRAG
          
          # Otimizações de Sync / Sincronização de Escrita I/O
          echo "CONFIG_FS_SYNC=y" >> $FRAG
          echo "CONFIG_SYNC_FILE=y" >> $FRAG
          echo "CONFIG_PROFILING=y" >> $FRAG
          
          # Otimizações de Rede e WireGuard Nativo
          echo "CONFIG_WIREGUARD=y" >> $FRAG
          echo "CONFIG_NET_CLS_ACT=y" >> $FRAG
          echo "CONFIG_NET_SCH_INGRESS=y" >> $FRAG
          
          # Opções do SUSFS
          echo "CONFIG_KSU_SUSFS=y" >> $FRAG
          echo "CONFIG_KSU_SUSFS_HAS_ALLOWED_PATH_MODIFY=y" >> $FRAG
          echo "CONFIG_KSU_SUSFS_AUTO_MOUNT_BY_KSU=y" >> $FRAG
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $FRAG
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $FRAG
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> $FRAG
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> $FRAG
          
          # ThinLTO estritamente mantido
          echo "CONFIG_THINLTO=y" >> $FRAG
          echo "CONFIG_LTO_CLANG_THIN=y" >> $FRAG
          echo "# CONFIG_LTO_CLANG_FULL is not set" >> $FRAG

          echo "GKI_DISABLE_DEBUG_FS=n" >> build.config.gki.aarch64

      - name: Compile Optimized GKI Kernel (ThinLTO Serialized Fix)
        run: |
          export CCACHE_DIR="/home/runner/.ccache"
          export CCACHE_MAXSIZE="10G"
          export CCACHE_COMPRESS=1
          
          cd gki_kernel/common
          
          # Força o setlocalversion a retornar estritamente a tua tag personalizada
          echo '#!/bin/sh' > scripts/setlocalversion
          echo 'echo "-Zeus-GKI-Kernel"' >> scripts/setlocalversion
          chmod +x scripts/setlocalversion
          
          cd ..
          export CC="ccache clang"
          export CXX="ccache clang++"
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          
          # A SOLUÇÃO DEFINITIVA PARA O TRAVAMENTO NO VMLINUX.O:
          export LDFLAGS="-Wl,--threads=1 --thinlto-jobs=1"
          export KBUILD_LDFLAGS="-Wl,--threads=1 --thinlto-jobs=1"
          export LLVM_PARALLEL_LINK_JOBS=1
          export THINLTO_JOBS=1
          
          ccache -s
          
          BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh
          
          ccache -s

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Zeus-GKI-Kernel_KernelSU_SUSFS_WireGuard
          path: |
            gki_kernel/out/android13-5.15/dist/Image*
            gki_kernel/out/android13-5.15/dist/*.dtb
